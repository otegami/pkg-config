name: Test

on:
  push:
    branches:
      - '**'
      - '!dependabot/**'
    tags:
      - '**'
  pull_request:

jobs:
  ruby-versions:
    uses: ruby/actions/.github/workflows/ruby_versions.yml@master
    with:
      engine: cruby
      min_version: 2.6

  test:
    name: "Ruby ${{ matrix.ruby-version }}: ${{ matrix.runs-on }}"
    needs: ruby-versions
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ${{ fromJson(needs.ruby-versions.outputs.versions) }}
        runs-on:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        exclude:
          - {ruby-version: "2.6", runs-on: windows-latest}
          - {ruby-version: "2.7", runs-on: windows-latest}
          - {ruby-version: "3.0", runs-on: windows-latest}
          - {ruby-version: "3.1", runs-on: windows-latest}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - name: Install system dependencies
        if: |
          runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -V -y libcairo-dev
      - name: Install system dependencies
        if: |
          runner.os == 'macOS'
        run: |
          brew bundle
      - name: Install system dependencies
        if: |
          runner.os == 'Windows'
        run: |
          ridk exec pacman --sync --noconfirm mingw-w64-x86_64-cairo mingw-w64-ucrt-x86_64-cairo mingw-w64-x86_64-re2 mingw-w64-ucrt-x86_64-re2
      - name: Install dependencies
        run: |
          bundle install
      - name: Debug pkg-config (RubyInstaller)
        if: |
          runner.os == 'Windows'
        run: |
          echo "=== pkgconf --version ==="
          ridk exec pkgconf --version
          echo ""
          echo "=== pkgconf --dump-personality ==="
          ridk exec pkgconf --dump-personality
          echo "=== pkgconf --help ==="
          ridk exec pkgconf --help
      - name: Debug pkgconf --debug --cflags re2 (RubyInstaller)
        if: |
          runner.os == 'Windows'
        run: |
          ridk exec pkgconf --debug --cflags re2 2>&1 | Out-File -FilePath pkgconf-debug-re2.txt -Encoding utf8
          $lines = (Get-Content pkgconf-debug-re2.txt).Count
          Write-Output "=== Output size: $lines lines ==="
      - name: Upload debug output (RubyInstaller)
        if: |
          runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: pkgconf-debug-re2-rubyinstaller
          path: pkgconf-debug-re2.txt
      - name: Test
        run: |
          bundle exec rake

  windows-msys2:
    name: Windows ${{ matrix.msystem }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: CLANG64
            package-prefix: mingw-w64-clang-x86_64
            runner: windows-latest
          - msystem: CLANGARM64
            package-prefix: mingw-w64-clang-aarch64
            runner: windows-11-arm
          - msystem: MINGW32
            package-prefix: mingw-w64-i686
            runner: windows-latest
          - msystem: MINGW64
            package-prefix: mingw-w64-x86_64
            runner: windows-latest
          - msystem: UCRT64
            package-prefix: mingw-w64-ucrt-x86_64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            base-devel
            ${{ matrix.package-prefix }}-cairo
            ${{ matrix.package-prefix }}-re2
            ${{ matrix.package-prefix }}-ruby
            ${{ matrix.package-prefix }}-toolchain
      - name: Install dependencies
        shell: msys2 {0}
        run: |
          bundle install
      - name: Debug pkg-config (MSYS2)
        shell: msys2 {0}
        run: |
          echo "=== pkgconf --version ==="
          pkgconf --version
          echo ""
          echo "=== pkgconf --dump-personality ==="
          pkgconf --dump-personality
          echo "=== pkgconf --help ==="
          pkgconf --help
          echo ""
          echo "=== which pkgconf ==="
          which pkgconf
          echo ""
          echo "=== PKG_CONFIG environment variables ==="
          env | grep -i pkg_config || true
          echo ""
          echo "=== pkgconf --cflags glib-2.0 ==="
          pkgconf --cflags glib-2.0
          echo ""
          echo "=== pkgconf --cflags --keep-system-cflags glib-2.0 ==="
          pkgconf --cflags --keep-system-cflags glib-2.0
      - name: Debug pkgconf --debug --cflags re2 (MSYS2)
        shell: msys2 {0}
        run: |
          pkgconf --debug --cflags re2 > pkgconf-debug-re2.txt 2>&1
          echo "=== Output size: $(wc -l < pkgconf-debug-re2.txt) lines ==="
      - name: Upload debug output (MSYS2)
        uses: actions/upload-artifact@v4
        with:
          name: pkgconf-debug-re2-msys2-${{ matrix.msystem }}
          path: pkgconf-debug-re2.txt
      - name: Test
        shell: msys2 {0}
        run: |
          bundle exec rake
